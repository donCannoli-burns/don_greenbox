name: Don Report Greenbox script build
on:
  pull_request:
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspaces
        run: |
          corepack enable
          yarn install --immutable
      - name: Build shared data and standalone report without executing KoL
        run: |
          yarn workspace greenbox-data build
          yarn workspace greenbox-script build
      - name: Preview standalone report formatting (temporary)
        run: |
          echo "DONFMT_START:packages/greenbox-script/src/don-report.ts"
          yarn prettier packages/greenbox-script/src/don-report.ts
          echo "DONFMT_END:packages/greenbox-script/src/don-report.ts"
      - name: Lint and test script
        run: |
          yarn workspace greenbox-script lint
          yarn workspace greenbox-script test run
